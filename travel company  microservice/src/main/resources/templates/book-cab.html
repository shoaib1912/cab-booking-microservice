<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book A Cab — George's Travel</title>
    <style>
        /* ── Reset & Base ────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Nav ─────────────────────────────────── */
        nav {
            width: 100%;
            background: #1a2a4a;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        nav .brand {
            color: #FFA500;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 24px;
        }
        nav ul a {
            color: #cdd9e5;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav ul a:hover { color: #FFA500; }

        /* ── Page Wrapper ────────────────────────── */
        .page-wrapper {
            width: 100%;
            max-width: 560px;
            margin: 48px auto;
            padding: 0 16px;
        }

        /* ── Card ────────────────────────────────── */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(26,42,74,0.12);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #1a2a4a 0%, #2d4a7a 100%);
            padding: 28px 32px;
            color: #fff;
        }
        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card-header p {
            font-size: 0.87rem;
            color: #a8c0e0;
        }

        .card-body { padding: 32px; }

        /* ── Form ────────────────────────────────── */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #d1d9e6;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1a2a4a;
            background: #f7f9fc;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: #2d4a7a;
            box-shadow: 0 0 0 3px rgba(45,74,122,0.1);
            background: #fff;
        }

        /* ── Fare Preview ────────────────────────── */
        .fare-preview {
            background: #f0f6ff;
            border: 1.5px dashed #a0bae0;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fare-preview .label { font-size: 0.84rem; color: #5a6d88; font-weight: 600; }
        .fare-preview .amount {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a2a4a;
        }
        .fare-preview .amount span { font-size: 0.85rem; color: #5a6d88; }

        /* ── Submit Button ───────────────────────── */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #FFA500, #ff8c00);
            color: #1a2a4a;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(255,165,0,0.4);
        }
        .btn-submit:active { transform: translateY(0); }

        /* ── Success Banner ──────────────────────── */
        .success-banner {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        /* ── Footer link ─────────────────────────── */
        .footer-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.88rem;
            color: #5a6d88;
        }
        .footer-link a { color: #2d4a7a; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        /* ── Rates Info ──────────────────────────── */
        .rates-info {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .rate-badge {
            flex: 1;
            background: #f7f9fc;
            border: 1.5px solid #d1d9e6;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.78rem;
        }
        .rate-badge .type { font-weight: 700; color: #1a2a4a; }
        .rate-badge .rate { color: #FFA500; font-weight: 700; font-size: 0.92rem; }
    </style>
</head>
<body>

<nav>
    <div class="brand">🚕 George's Travel</div>
    <ul>
        <li><a href="/cab/book-form">Book Cab</a></li>
        <li><a href="/cab/view-bookings">My Bookings</a></li>
        <li><a href="/passenger/profile-form">Profile</a></li>
        <li><a href="/h2-console" target="_blank">DB Console</a></li>
    </ul>
</nav>

<div class="page-wrapper">
    <div class="card">
        <div class="card-header">
            <h1>Book A Cab</h1>
            <p>Enter your trip details below to confirm your booking.</p>
        </div>
        <div class="card-body">

            <div class="success-banner" id="successBanner">
                ✅ Booking confirmed! Your cab is on the way.
            </div>

            <!-- Rate Info Badges -->
            <div class="rates-info">
                <div class="rate-badge">
                    <div class="type">Economy</div>
                    <div class="rate">₹10/km</div>
                </div>
                <div class="rate-badge">
                    <div class="type">Premium</div>
                    <div class="rate">₹15/km</div>
                </div>
                <div class="rate-badge">
                    <div class="type">Luxury</div>
                    <div class="rate">₹25/km</div>
                </div>
            </div>

            <!-- Book Cab Form (matches reference: action="/cab/book" method="post") -->
            <form id="bookingForm" action="/cab/book" method="post"
                  onsubmit="return handleSubmit(event)">

                <div class="form-group">
                    <label for="from">From Location</label>
                    <input type="text" id="from" name="from"
                           placeholder="Home" required />
                </div>

                <div class="form-group">
                    <label for="to">To Location</label>
                    <input type="text" id="to" name="to"
                           placeholder="Work" required />
                </div>

                <div class="form-group">
                    <label for="typeOfCab">Type of Cab</label>
                    <select id="typeOfCab" name="typeOfCab" onchange="updateFare()" required>
                        <option value="">— Select Cab Type —</option>
                        <option value="1">1 — Economy (₹10/km)</option>
                        <option value="2">2 — Premium (₹15/km)</option>
                        <option value="3">3 — Luxury  (₹25/km)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="distanceKm">Distance (km)</label>
                    <input type="number" id="distanceKm" name="distanceKm"
                           placeholder="e.g. 12.5" step="0.1" min="0.1"
                           oninput="updateFare()" required />
                </div>

                <div class="form-group">
                    <label for="passengerName">Passenger Name</label>
                    <input type="text" id="passengerName" name="passengerName"
                           placeholder="Your full name" required />
                </div>

                <!-- Live Fare Preview -->
                <div class="fare-preview">
                    <span class="label">Estimated Fare</span>
                    <span class="amount" id="fareDisplay">₹ —<span></span></span>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Confirm Booking →
                </button>
            </form>
        </div>
    </div>

    <div class="footer-link">
        <a href="/cab/view-bookings">View all bookings →</a>
    </div>
</div>

<script>
    const RATES = { 1: 10, 2: 15, 3: 25 };
    const BASE_FARE = 50;

    function updateFare() {
        const type = parseInt(document.getElementById('typeOfCab').value);
        const dist = parseFloat(document.getElementById('distanceKm').value);
        const display = document.getElementById('fareDisplay');

        if (type && dist > 0) {
            const fare = Math.max(dist * RATES[type], BASE_FARE);
            display.innerHTML = '₹ ' + fare.toFixed(2) + '<span> (incl. base fare)</span>';
        } else {
            display.innerHTML = '₹ —<span></span>';
        }
    }

    function handleSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const data = {
            from: form.from.value,
            to: form.to.value,
            typeOfCab: parseInt(form.typeOfCab.value),
            distanceKm: parseFloat(form.distanceKm.value),
            passengerName: form.passengerName.value
        };

        fetch('/cab/book', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(booking => {
            const banner = document.getElementById('successBanner');
            banner.textContent =
                '✅ Booking #' + booking.bookingId + ' confirmed! Fare: ₹' +
                booking.fare.toFixed(2) + ' — Status: ' + booking.status;
            banner.style.display = 'block';
            form.reset();
            document.getElementById('fareDisplay').innerHTML = '₹ —<span></span>';
        })
        .catch(err => {
            alert('Booking failed. Please try again.\n' + err);
        });
        return false;
    }
</script>

</body>
</html>
